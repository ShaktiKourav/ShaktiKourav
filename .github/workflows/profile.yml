name: GitHub Profile Auto Generator

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # ======================
      # 🐍 SNAKE
      # ======================
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShaktiKourav
          outputs: |
            dist/snake.svg

      # ======================
      # 📊 METRICS SVG
      # ======================
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ShaktiKourav
          template: classic
          base: header, activity, repositories, metadata

          plugin_languages: yes
          plugin_activity: yes
          plugin_isocalendar: yes
          plugin_stars: yes

      # ======================
      # 🧊 3D PROFILE
      # ======================
      - name: Generate 3D Profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        with:
          username: ShaktiKourav
          output: dist/profile-3d.svg

      # ======================
      # 🚀 DEPLOY CLEAN OUTPUT
      # ======================
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output