name: Generate GitHub Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # =========================
      # 🐍 SNAKE ANIMATION
      # =========================
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ShaktiKourav
          outputs: |
            dist/snake.svg

      # =========================
      # 📊 METRICS
      # =========================
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ShaktiKourav
          template: classic

          base: header, activity, repositories, metadata

          plugin_languages: yes
          plugin_activity: yes
          plugin_isocalendar: yes
          plugin_stars: yes

          output_action: none

      # =========================
      # 🚀 DEPLOY OUTPUT BRANCH
      # =========================
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output