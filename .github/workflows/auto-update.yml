
name: Auto Profile Update

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run GitHub Script
        run: node scripts/fetch-github.js

      - name: Run LeetCode Script
        run: node scripts/fetch-leetcode.js
        continue-on-error: true
        env:
          LEETCODE_USERNAME: Shakti_kourav

      - name: Run HackerRank Script
        run: node scripts/fetch-hackerrank.js
        continue-on-error: true
        env:
          HACKERRANK_USERNAME: kouravshakti72

      - name: Run Microsoft Learn Script
        run: node scripts/fetch-mslearn.js
        continue-on-error: true

      - name: Generate Summary
        run: node scripts/generate-summary.js
        continue-on-error: true

      - name: Update README
        run: node scripts/update-readme.js
        continue-on-error: true

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "Auto Profile Update"

          git push

